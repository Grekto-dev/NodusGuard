<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.mintsecurity.Antimalware"/>
    <allow own="org.mintsecurity.Firewall"/>
    <allow own="org.mintsecurity.Recovery"/>
    <allow own="org.mintsecurity.Network"/>
    <allow own="org.mintsecurity.Browsing"/>
    <allow own="org.mintsecurity.Isolation"/>
    <allow own="org.mintsecurity.Rescue"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.mintsecurity.Antimalware"/>
    <allow send_destination="org.mintsecurity.Firewall"/>
    <allow send_destination="org.mintsecurity.Recovery"/>
    <allow send_destination="org.mintsecurity.Network"/>
    <allow send_destination="org.mintsecurity.Browsing"/>
    <allow send_destination="org.mintsecurity.Isolation"/>
    <allow send_destination="org.mintsecurity.Rescue"/>
    <allow receive_sender="org.mintsecurity.Antimalware"/>
    <allow receive_sender="org.mintsecurity.Firewall"/>
    <allow receive_sender="org.mintsecurity.Recovery"/>
    <allow receive_sender="org.mintsecurity.Network"/>
    <allow receive_sender="org.mintsecurity.Browsing"/>
    <allow receive_sender="org.mintsecurity.Isolation"/>
    <allow receive_sender="org.mintsecurity.Rescue"/>
  </policy>
</busconfig>
